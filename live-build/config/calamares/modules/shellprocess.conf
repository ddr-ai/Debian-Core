# DainRaku OS — Calamares Post-Install Shell Process
# Runs dainraku-hwdetect after the base system is installed.

dontChroot: false
timeout: 600

script:
  - "-/usr/local/bin/dainraku-hwdetect"
  - "-/usr/bin/snapper --config root create-config /"
  - "-/usr/bin/systemctl enable zramswap"
  - "-/usr/bin/systemctl enable fstrim.timer"
  - "-/usr/bin/update-initramfs -u -k all"
  - "-/usr/bin/plymouth-set-default-theme --rebuild-initrd dainraku"
