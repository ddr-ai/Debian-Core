# DainRaku OS — Calamares Partition Module Configuration
# Defaults to BTRFS with optimized subvolume layout.

efiSystemPartition: /boot/efi
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: EFI System Partition

defaultFileSystemType: btrfs

# BTRFS subvolume layout
btrfsSubvolumes:
  - mountPoint: /
    subvolume: @
  - mountPoint: /home
    subvolume: @home
  - mountPoint: /var
    subvolume: @var
  - mountPoint: /tmp
    subvolume: @tmp
  - mountPoint: /.snapshots
    subvolume: @snapshots

# BTRFS mount options for all subvolumes
btrfsMountOptions: "compress=zstd:3,noatime,space_cache=v2,autodefrag,discard=async"

# Recommended partition sizes
requiredStorage: 25.0   # GB minimum

# Swap: ZRAM is used instead of a swap partition
neverCreateSwap: true
