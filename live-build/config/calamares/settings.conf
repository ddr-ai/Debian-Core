# DainRaku OS — Calamares Installer Configuration
# Orchestrates the DainRaku installation sequence.

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary

  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - shellprocess@post-install
    - grubcfg
    - bootloader
    - packages
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg
    - initcpio
    - removeuser
    - umount

  - show:
    - finished

branding: dainraku
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
