name: Build & Publish DainRaku OS ISO

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0-dev'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'true'
        type: boolean
      packages:
        description: 'JSON array of extra package names to include (e.g. ["nmap","wireshark"]). Leave empty for default package set.'
        required: false
        default: '[]'

permissions:
  contents: write  # required to create releases & upload assets

jobs:
  build:
    name: Build ISO
    # GitHub-hosted runners have ~14 GB free; the ISO build needs ~30 GB.
    # The cleanup steps below reclaim enough space on ubuntu-22.04, but if
    # GitHub changes what's pre-installed you may hit out-of-space failures.
    # To eliminate the risk entirely, switch to a self-hosted runner:
    #   runs-on: [self-hosted, linux, x64]
    # Self-hosted runners should have ≥ 60 GB free disk and sudo access.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── Free up extra disk space ────────────────────────────────────────────
      # GitHub-hosted runners have ~14 GB free by default; lb build needs ~30 GB.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ── Guard: verify enough disk space is available ─────────────────────────
      - name: Verify available disk space (need ≥ 30 GB)
        run: |
          AVAIL_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G ')
          echo "Available disk space after cleanup: ${AVAIL_GB} GB"
          if [[ "${AVAIL_GB}" -lt 30 ]]; then
            echo "::error::Insufficient disk space: ${AVAIL_GB} GB available, at least 30 GB required." >&2
            echo "" >&2
            echo "Options to resolve:" >&2
            echo "  1. Add more cleanup steps in the 'Free up disk space' step above." >&2
            echo "  2. Switch to a self-hosted runner with ≥ 60 GB free disk" >&2
            echo "     (change runs-on to: [self-hosted, linux, x64])." >&2
            exit 1
          fi
          echo "Disk space check passed: ${AVAIL_GB} GB available."

      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Record build start time (used for elapsed time in job summary) ───────
      - name: Record build start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ── Determine version string ────────────────────────────────────────────
      - name: Set release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      # ── Write custom package list from web builder ───────────────────────────
      - name: Write custom package list
        run: |
          PACKAGES='${{ github.event.inputs.packages }}'
          if [[ -z "$PACKAGES" || "$PACKAGES" == "[]" ]]; then
            echo "No custom packages requested — using default package lists."
          elif ! echo "$PACKAGES" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            echo "Warning: could not parse packages JSON (or empty list) — skipping custom list." >&2
          else
            OUT_DIR="live-build/config/package-lists"
            OUT_PATH="${OUT_DIR}/custom-web.list.chroot"
            mkdir -p "$OUT_DIR"
            {
              echo '# Custom packages requested via the DainRaku web ISO builder'
              echo "$PACKAGES" | jq -r '.[] | tostring' | sort -u
            } > "$OUT_PATH"
            COUNT=$(( $(wc -l < "$OUT_PATH") - 1 ))
            echo "Wrote ${COUNT} custom packages to ${OUT_PATH}"
          fi

      # ── Make hooks executable ────────────────────────────────────────────────
      - name: Set hook permissions
        run: |
          sudo chmod +x live-build/config/hooks/live/*.hook.chroot 2>/dev/null || true
          sudo chmod +x live-build/config/hooks/normal/*.hook.chroot 2>/dev/null || true
          sudo chmod +x live-build/config/includes.chroot/usr/local/bin/dainraku-* 2>/dev/null || true

      # ── Cache live-build downloaded packages ────────────────────────────────
      # live-build stores downloaded .deb packages and the bootstrap under
      # live-build/cache. Keyed on the package lists so the cache invalidates
      # whenever the package selection changes; restore-keys still allow a
      # partial hit (apt only re-downloads what changed).
      - name: Cache live-build package downloads
        uses: actions/cache@v4
        with:
          path: live-build/cache
          key: lb-cache-${{ runner.os }}-${{ hashFiles('live-build/config/package-lists/**', 'live-build/auto/config') }}
          restore-keys: |
            lb-cache-${{ runner.os }}-

      # ── Build the ISO inside a Debian Bookworm container ─────────────────────
      # The GitHub runner is Ubuntu, whose live-build fork is too old and rejects
      # modern Debian options (--image-name, --uefi-secure-boot, etc.). Running
      # the build inside debian:bookworm guarantees a matching live-build that
      # understands the config. --privileged is required so debootstrap can mount
      # /proc, /sys and loopback devices inside the chroot.
      - name: Run lb config + build (debian:bookworm container)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/build \
            -w /build \
            debian:bookworm \
            bash -c '
              set -eo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                curl gpg ca-certificates apt-transport-https
              cd live-build
              bash auto/config
              lb build 2>&1 | tee ../build.log
            '

      # ── Fix cache dir ownership so the post-job cache save can read it ───────
      # lb build runs under sudo, leaving live-build/cache root-owned; the
      # actions/cache post step runs as the runner user and needs read access.
      - name: Fix live-build cache permissions
        if: always()
        run: |
          if [[ -d live-build/cache ]]; then
            sudo chown -R "$(id -u):$(id -g)" live-build/cache
          fi
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives 2>/dev/null || true

      # ── Locate ISO & generate checksums ──────────────────────────────────────
      - name: Locate ISO and compute checksums
        id: iso
        run: |
          ISO=$(find live-build -maxdepth 1 -name "*.iso" | head -1)
          if [[ -z "$ISO" ]]; then
            echo "ERROR: No ISO found after build. Check build.log." >&2
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          DEST="dainraku-os-${VERSION}-amd64.iso"
          cp "$ISO" "$DEST"

          sha256sum "$DEST" > "${DEST}.sha256"
          MD5SUM=$(md5sum "$DEST" | awk '{print $1}')
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(du -sh "$DEST" | awk '{print $1}')

          echo "iso_path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "sha256_path=${DEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "md5=${MD5SUM}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "ISO: ${DEST}"
          echo "SHA256: ${SHA256}"
          echo "Size: ${SIZE}"

      # ── Post job summary ────────────────────────────────────────────────────
      - name: Post build summary
        if: success()
        run: |
          END=$(date +%s)
          START=${{ steps.timer.outputs.start }}
          ELAPSED=$(( END - START ))
          MINUTES=$(( ELAPSED / 60 ))
          SECONDS=$(( ELAPSED % 60 ))
          {
            echo "## ✅ DainRaku OS Build Succeeded"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Version** | \`${{ steps.version.outputs.version }}\` |"
            echo "| **ISO size** | ${{ steps.iso.outputs.size }} |"
            echo "| **SHA256** | \`${{ steps.iso.outputs.sha256 }}\` |"
            echo "| **Elapsed time** | ${MINUTES}m ${SECONDS}s |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload build log as artifact (always, even on failure) ──────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.version }}
          path: build.log
          retention-days: 30

      # ── Determine release type ───────────────────────────────────────────────
      - name: Determine pre-release flag
        id: release_type
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE="true"   # versions like v1.0.0-beta are pre-releases
          else
            PRERELEASE="false"
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "DainRaku OS ${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          body: |
            ## DainRaku OS ${{ steps.version.outputs.version }}

            A precision-engineered penetration testing distribution built on Debian Bookworm,
            powered by the Liquorix kernel and armed with 300+ security tools.

            ### Download

            | File | Size | SHA256 |
            |------|------|--------|
            | `dainraku-os-${{ steps.version.outputs.version }}-amd64.iso` | ${{ steps.iso.outputs.size }} | `${{ steps.iso.outputs.sha256 }}` |

            ### Verify integrity

            ```bash
            sha256sum -c dainraku-os-${{ steps.version.outputs.version }}-amd64.iso.sha256
            ```

            ### Write to USB

            ```bash
            # Linux / macOS
            sudo dd if=dainraku-os-${{ steps.version.outputs.version }}-amd64.iso \
                    of=/dev/sdX bs=4M status=progress oflag=sync

            # Or use Balena Etcher: https://etcher.balena.io
            ```

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ---
            Built automatically by GitHub Actions from commit `${{ github.sha }}`.
          files: |
            ${{ steps.iso.outputs.iso_path }}
            ${{ steps.iso.outputs.sha256_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
